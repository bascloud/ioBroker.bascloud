# Dependabot will run on day 12 of each month at 01:13 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "13 1 12 * *"
    open-pull-requests-limit: 15
    assignees:
      - "BAScloud"
    versioning-strategy: "increase"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "13 1 12 * *"
    open-pull-requests-limit: 15
    assignees:
      - "BAScloud"
